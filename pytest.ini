[pytest]
# Puts the project root on sys.path so `from tests.conftest import ...` works whether you
# run `pytest` or `python -m pytest` (only the second adds the current directory itself).
pythonpath = .
asyncio_mode = auto
# One event loop for the whole test session, not one per test function. The DB engine
# (database/connection.py) is a module-level singleton, and its pooled asyncpg connections
# are tied to the loop they were created on - a per-test loop would break them on reuse.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
